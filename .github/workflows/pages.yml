name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/p5/lib _site/node_modules/p5.brush/dist
          cp preview.html _site/index.html
          cp -r src _site/src
          cp node_modules/p5/lib/p5.min.js _site/node_modules/p5/lib/
          cp node_modules/p5.brush/dist/p5.brush.js _site/node_modules/p5.brush/dist/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
