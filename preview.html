<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeky · DeepSeek Sprite Preview</title>
<style>
  :root { --ds: #4D6BFE; --ds-dk: #2E46C2; --ds-lt: #9DAEFF; --ink: #2B2233; --paper: #F3EBDC; --bg: #F5F7FF; --card: #FFFFFF; --muted: #5E6478; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding: 22px 28px 10px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; color: var(--ds-dk); letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; padding: 8px 28px 28px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px rgba(46, 70, 194, .08); padding: 14px 16px; }
  .stage { padding: 10px; }
  #out { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 10px; background: var(--paper); }
  .page-link { color: var(--ds-dk); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
  .status { display: flex; gap: 12px; align-items: center; margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status input[type=range] { display: none; }
  h2 { font-size: 15px; margin: 4px 0 8px; color: var(--ds-dk); }
  .group { margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid #D5DCFF; background: #fff; color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--ds); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ds); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ds); border-color: var(--ds); color: #fff; }
  .tabs button { padding: 6px 14px; font-weight: 600; }
  label.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  label.row span { min-width: 64px; color: var(--muted); }
  select, input[type=range] { flex: 1; }
  select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid #D5DCFF; background: #fff; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .sw i { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); }
  ul.notes { margin: 0; padding-left: 18px; }
  ul.notes li { margin: 3px 0; }
  .fam { font-size: 12px; color: var(--muted); margin: 6px 0 3px; }
  .hint { font-size: 12px; color: var(--muted); }
  .warn { display: none; background: #FFF4E5; color: #8A4B00; padding: 10px 14px; border-radius: 10px; margin: 0 28px 12px; }
  .lang { margin-left: auto; display: flex; gap: 4px; }
  .lang button { padding: 4px 12px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <p data-i18n="intro"></p>
  <a class="page-link" id="storyLink" href="studio.html" data-i18n="storyLink">Watch the story demo</a>
  <div class="lang" role="group" data-i18n-aria="langGroup">
    <button data-lang="en" lang="en">English</button>
    <button data-lang="zh" lang="zh-CN">中文</button>
  </div>
</header>
<div class="warn" id="warn" role="alert"></div>
<main>
  <section class="card stage" data-i18n-aria="stageArea">
    <div class="tabs" role="group" data-i18n-aria="modes">
      <button data-mode="stage" aria-pressed="true" data-i18n="tabStage"></button>
      <button data-mode="emotions" aria-pressed="false" data-i18n="tabEmotions"></button>
      <button data-mode="views" aria-pressed="false" data-i18n="tabViews"></button>
      <button data-mode="hats" aria-pressed="false" data-i18n="tabHats1"></button>
      <button data-mode="hats2" aria-pressed="false" data-i18n="tabHats2"></button>
    </div>
    <canvas id="out" width="1920" height="1080" role="img" data-i18n-aria="canvas"></canvas>
    <div class="status">
      <button id="play" aria-pressed="true"></button>
      <span id="tt" data-i18n="loading"></span>
      <input id="scrub" type="range" min="0" max="4" step="0.0417" value="0" aria-hidden="true" tabindex="-1">
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>
  <aside class="card" data-i18n-aria="panel">
    <div class="group">
      <h2 data-i18n="hEmotions"></h2>
      <div id="emos"></div>
    </div>
    <div class="group">
      <h2 data-i18n="hViews"></h2>
      <div class="chips" id="views" role="group" data-i18n-aria="hViews"></div>
      <label class="row"><input type="checkbox" id="flip"> <span data-i18n="flip"></span></label>
      <label class="row"><input type="checkbox" id="spin"> <span data-i18n="spin"></span></label>
    </div>
    <div class="group">
      <h2 data-i18n="hOutfit"></h2>
      <label class="row"><span data-i18n="hat"></span><select id="hat"></select></label>
      <label class="row"><span data-i18n="emote"></span><select id="emote"></select></label>
      <label class="row"><span data-i18n="dance"></span><select id="dance"></select></label>
      <label class="row"><span data-i18n="size"></span><input type="range" id="size" min="12" max="56" value="30"><output id="sizeV">30</output></label>
      <label class="row"><span data-i18n="bg"></span><select id="bg"><option value="sky" data-i18n="bgSky"></option><option value="sea" data-i18n="bgSea"></option><option value="night" data-i18n="bgNight"></option><option value="paper" data-i18n="bgPaper"></option></select></label>
    </div>
    <div class="group">
      <h2 data-i18n="hColours"></h2>
      <div class="swatches">
        <div class="sw"><i style="background:#4D6BFE"></i>#4D6BFE<br><span data-i18n="cBody"></span></div>
        <div class="sw"><i style="background:#2E46C2"></i>#2E46C2<br><span data-i18n="cShade"></span></div>
        <div class="sw"><i style="background:#9DAEFF"></i>#9DAEFF<br><span data-i18n="cHighlight"></span></div>
        <div class="sw"><i style="background:#E6EBFF"></i><span data-i18n="cBelly"></span></div>
        <div class="sw"><i style="background:#2B2233"></i><span data-i18n="cInk"></span></div>
      </div>
    </div>
    <div class="group">
      <h2 data-i18n="hNotes"></h2>
      <ul class="notes" id="notes"></ul>
    </div>
  </aside>
</main>
<script type="module">
// The character and UI scripts keep their existing shared scope; only the
// rendering backend changes. Everything is served from the local project.
window.CUSTOM_PLAYBACK = true;
window.showPixiError = error => {
  const message = error?.message || String(error);
  window.__pixiPreviewError = message;
  const warning = document.getElementById('warn');
  warning.textContent = '无法启动或渲染 Pixi 预览 / Could not load or render the Pixi preview. 请先运行 npm install 和 npm run dev，并使用显示的本地地址 / Run npm install and npm run dev, then open the local URL.\n' + message;
  warning.style.display = 'block';
};
window.addEventListener('unhandledrejection', event => window.showPixiError(event.reason));
window.addEventListener('error', event => { if (event.message) window.showPixiError(event.error || event.message); });
const loadScript = (src, text) => new Promise((ok, fail) => {
  const s = document.createElement('script');
  if (src) { s.src = src; s.onload = ok; s.onerror = () => fail(new Error('无法加载本地脚本 / Failed to load local script: ' + src)); }
  else { s.textContent = text; }
  document.body.appendChild(s);
  if (!src) ok();
});
try {
  await loadScript('node_modules/pixi.js/dist/pixi.min.js');
  await loadScript('node_modules/p5.brush/dist/pixi.brush.js');
  window.PixiBrushEngine = window.pixiBrush;
  if (!window.PIXI || !window.PixiBrushEngine?.createPixiBrush) throw new Error('本地 Pixi GPU 引擎不可用 / Local Pixi GPU engine is unavailable.');
  for (const f of ['config', 'pixi-runtime', 'core', 'seeky', 'hats', 'timeline', 'sheets']) await loadScript('src/' + f + '.js');
  for (const el of document.querySelectorAll('script[data-app]')) await loadScript(null, el.textContent);
  await setup();
} catch (e) {
  console.error(e);
  window.showPixiError(e);
}
for (const f of ['config', 'core', 'seeky', 'hats', 'timeline', 'sheets']) await loadScript('src/' + f + '.js');
for (const el of document.querySelectorAll('script[data-app]')) await loadScript(null, el.textContent);
// p5 only auto-starts global mode when setup() exists at the window "load" event; that has already passed.

</script>

<script type="text/plain" data-app>
(() => {
  const FAMILIES = [
    ['happy', 'excited', 'laugh', 'love', 'proud', 'starstruck', 'playful', 'hopeful', 'relieved'],
    ['smug', 'cool', 'mischief', 'suspicious'],
    ['sad', 'cry', 'bored', 'sleepy', 'ko'],
    ['angry', 'furious', 'determined', 'disgusted'],
    ['scared', 'nervous', 'surprised', 'confused', 'dizzy'],
    ['neutral', 'thinking', 'idea', 'shy'],
  ];
  const HEAD = { front: 0, q: .125, side: .25, qback: .375, back: .5 };
  const HATS = ['', 'party', 'hard', 'crown', 'halo', 'wizard', 'hood', 'top', 'fedora', 'band', 'sweatband', 'beanie', 'bow', 'flower', 'headphones', 'cat', 'masq', 'mask', 'bowtie'];
  const EMOTES = ['', '!', '?', '!!', '!?', 'zzz', 'sweat', 'spark', 'heart', 'hearts', 'anger', 'steam', 'bulb', 'dots', 'scribble', 'music', 'swirl', 'stars', 'cloud'];
  const DANCES = ['', 'swim', 'bounce', 'hop', 'roof', 'sway', 'spin', 'wave', 'stomp', 'shimmy', 'mix'];

  // Interactive state. Each change records when it happened, so emotions() and turn() can act it out.
  const S = { mode: 'stage', emo: 'happy', keys: [[-99, 'happy']], view: 'front', head: 0, turnFrom: 0, turnAt: -99,
              flip: false, spin: false, hat: '', emote: '', dance: '', u: 30, bg: 'sky' };
  let clock = 0, playing = true, last = performance.now(), dirty = true;

  const $ = id => document.getElementById(id);
  const chip = (txt, pressed, on) => { const b = document.createElement('button'); b.textContent = txt; b.setAttribute('aria-pressed', pressed); b.onclick = on; return b; };
  const press = (box, b) => { box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };

  FAMILIES.forEach((names, fi) => {
    const t = document.createElement('div'); t.className = 'fam'; t.dataset.fam = fi; $('emos').appendChild(t);
    const box = document.createElement('div'); box.className = 'chips'; box.setAttribute('role', 'group'); box.dataset.famAria = fi;
    names.forEach(n => box.appendChild(chip(n, n === S.emo, e => {
      $('emos').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === e.target));
      if (n !== S.emo) { S.keys = [[-99, S.emo], [clock, n]]; S.emo = n; dirty = true; }
    })));
    $('emos').appendChild(box);
  });
  Object.keys(HEAD).forEach(v => $('views').appendChild(chip(v, v === S.view, e => {
    press($('views'), e.target); S.turnFrom = curHead(clock); S.turnAt = clock; S.view = v; S.head = HEAD[v]; dirty = true;
  })));
  // option labels: the code names stay as they are; only the empty choice and the swim dance get translated
  const fill = (sel, list, empty) => list.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; if (!v) o.dataset.i18n = empty; if (v === 'swim') o.dataset.i18n = 'swim'; sel.appendChild(o); });
  fill($('hat'), HATS, 'none'); fill($('emote'), EMOTES, 'none'); fill($('dance'), DANCES, 'noDance');

  // Apply the current language to every labelled element, the lists built above, and the play button.
  function applyLang() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = tr('pageTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.i18nAria)));
    document.querySelectorAll('[data-fam]').forEach(el => { el.textContent = tr('fams')[el.dataset.fam]; });
    document.querySelectorAll('[data-fam-aria]').forEach(el => el.setAttribute('aria-label', tr('fams')[el.dataset.famAria]));
    $('notes').replaceChildren(...tr('notes').map(s => { const li = document.createElement('li'); li.textContent = s; return li; }));
    $('play').textContent = tr(playing ? 'pause' : 'play');
    $('storyLink').href = 'studio.html?lang=' + LANG;
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  }
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
    LANG = b.dataset.lang; try { localStorage.setItem('seeky-lang', LANG); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u);
    applyLang();
  });
  applyLang();
  $('hat').onchange = e => { S.hat = e.target.value; dirty = true; };
  $('emote').onchange = e => { S.emote = e.target.value; S.emoteAt = clock; dirty = true; };
  $('dance').onchange = e => { S.dance = e.target.value; dirty = true; };
  $('bg').onchange = e => { S.bg = e.target.value; dirty = true; };
  $('size').oninput = e => { S.u = +e.target.value; $('sizeV').value = S.u; dirty = true; };
  $('flip').onchange = e => { S.turnFrom = curHead(clock); S.turnAt = clock; S.flip = e.target.checked; dirty = true; };
  $('spin').onchange = e => { S.spin = e.target.checked; dirty = true; };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { press(b.parentNode, b); S.mode = b.dataset.mode; dirty = true; });
  $('play').onclick = () => { playing = !playing; $('play').textContent = tr(playing ? 'pause' : 'play'); $('play').setAttribute('aria-pressed', playing); last = performance.now(); };

  // heading in turns (0 front, .25 facing right, -.25 facing left); a change turns through the drawn key views
  const target = () => S.flip ? -S.head : S.head;
  const curHead = t => lerp(S.turnFrom, target(), ease(seg(t, S.turnAt, S.turnAt + .25)));
  const G = 900;   // ground line of the stage
  function backdrop(t) {
    boilSeed('bg');
    if (S.bg === 'paper') { inkLine([[160, G + 6], [W / 2, G + 3], [W - 160, G + 7]], .8, mixCol(PAL.paper, PAL.ink, .35), 'inkfine', .5); return; }
    const night = S.bg === 'night', sea = S.bg === 'sea';
    paint(rectPts(-60, -60, W + 120, H + 120), { wash: night ? PAL.night : '#CFE0F6', ink: null });
    paint(ellPts(W * .5, H * .3, W * .55, H * .32, 26, 10), { fill: night ? PAL.indigo : '#EAF2FF', fillOp: 110, bleed: .3, tex: .6, ink: null });
    if (night) for (let i = 0; i < 30; i++) {
      boilSeed('star' + i);
      const tw = .55 + .45 * Math.sin(t * (2 + 2 * hash(i + 300)) + i);
      paint(starPts(hash(i) * W, hash(i + 100) * H * .6, (3 + 5 * hash(i + 200)) * tw, .35, 4), { wash: PAL.cream, washOp: 150 + 100 * tw, ink: null });
    } else for (let i = 0; i < 3; i++) {   // slow drifting clouds
      boilSeed('cloud' + i);
      const cx = ((hash(i) * W + t * (14 + 8 * i)) % (W + 600)) - 300, cy = 140 + 110 * i;
      paint(ellPts(cx, cy, 170 - 30 * i, 46, 20, 4), { wash: '#FFFFFF', washOp: 200, fill: PAL.sky, fillOp: 40, ink: null });
    }
    boilSeed('ground');
    if (sea) {
      paint(rectPts(-60, G - 40, W + 120, H - G + 100, 3), { wash: mixCol(PAL.ds, '#FFFFFF', .45), fill: PAL.ds, fillOp: 70, bleed: .05, tex: .6, ink: null });
      for (let k = 0; k < 3; k++) {   // rolling wave crests
        boilSeed('wave' + k);
        const y = G - 30 + k * 60, P = []; for (let i = 0; i <= 24; i++) { const x = -40 + i * (W + 80) / 24; P.push([x, y + 9 * Math.sin(i * .9 + t * (1.4 + k * .3) + k)]); }
        inkLine(P, .8, mixCol(PAL.cream, PAL.ds, .2), 'inkfine', .5);
      }
    } else {
      paint(rectPts(-60, G - 20, W + 120, H - G + 100, 3), { wash: night ? mixCol(PAL.sap, PAL.night, .35) : '#BFD9A4', fill: night ? mixCol(PAL.sap, PAL.night, .55) : PAL.sap, fillOp: 70, bleed: .05, tex: .6, ink: null });
      inkLine([[-60, G - 18], [W / 2, G - 24], [W + 60, G - 16]], 1, PAL.ink, 'ink', .5);
    }
  }

  // The stage: one Seeky, acting whatever the panel says, from the moment it was asked.
  function stage(t) {
    camBegin(960 + 14 * Math.sin(t * .5), 560, 1);
    backdrop(t);
    const mood = emotions(t, S.keys);
    const a = S.spin ? Math.floor(t * 2) / 8 : curHead(t);
    const facing = S.spin ? spinView(a) : turn(t, S.turnAt, S.turnAt + .25, S.turnFrom, target());
    let o = { ...mood, ...facing, seed: 3 };
    if (S.dance === 'swim') o.walk = t * .9;
    else if (S.dance) { const m = move(S.dance, t); o = { ...o, ...m, dy: (mood.dy || 0) + m.dy, sq: (mood.sq || 0) + m.sq, eyes: mood.eyes, mouth: mood.mouth }; }
    if (S.hat) o.hat = S.hat;
    if (S.emote) { o.emote = S.emote; o.emoteAge = t - (S.emoteAt || 0); o.emoteK = seg(o.emoteAge, 0, .3); }
    seeky(960, G - 10, S.u, o);
    camEnd();
  }
  stage.len = 4;

  // One render at a time on the real clock; preview frames are never PNG-encoded.
  // The model sheets redraw less often than the single-character stage.
  let busy = false, lastSheet = -1;
  async function tick() {
    const now = performance.now();
    if (playing) clock += (now - last) / 1000;
    last = now;
    const sheet = S.mode !== 'stage';
    if (window.ready && !busy && (playing || dirty) && !(sheet && !dirty && clock - lastSheet < .6)) {
      busy = true; dirty = false;
      window.LOOP = sheet ? LOOPS[S.mode] : stage;
      const t0 = performance.now();
      try { await window.renderFrame(sheet ? clock % (window.LOOP.len || 4) : clock); }
      catch (e) { console.error(e); window.showPixiError(e); playing = false; $('play').textContent = tr('play'); $('play').setAttribute('aria-pressed', false); }
      if (sheet) lastSheet = clock;
      $('tt').textContent = `PixiJS · GPU · ${clock.toFixed(2)}s · ${Math.round(performance.now() - t0)} ${tr('msFrame')}`;
      busy = false;
    }
    requestAnimationFrame(tick);
  }
  const start = () => window.__pixiPreviewError ? undefined : window.ready ? (last = performance.now(), tick()) : setTimeout(start, 100);
  start();
})();
</script>
</body>
</html>
